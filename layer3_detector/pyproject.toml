[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsyp-layer3-detector"
version = "3.0.0"
description = "TSYP14 Track 2 Layer 3: causal, calibrated false-data-injection detector for WegenerNet weather streams"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["detector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
