# Mosquitto 2.x broker for the CIS pipeline: MQTT v5 over mutual TLS.
# Run from the repository root (paths are relative to the working directory):
#   mosquitto -c config/mosquitto/mosquitto.conf -v
# Certificates come from: python -m tools.generate_certs
# Single listener, so the security settings below are global.

listener 8883 127.0.0.1
cafile certs/ca.crt
certfile certs/server.crt
keyfile certs/server.key
tls_version tlsv1.2

# Every client must present a certificate signed by our CA; its CN becomes
# the MQTT username used by the ACL (sensor_01, ..., gateway).
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file config/mosquitto/acl.conf

max_packet_size 4096
